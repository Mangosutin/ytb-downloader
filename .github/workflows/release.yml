name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distribution zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "YTB-downloader-$tag.zip"
          $paths = @("main.py", "run.py", "ytbdl", "config.example.toml", "requirements.txt", "README.md", "SPEC.md")
          Compress-Archive -LiteralPath $paths -DestinationPath $asset -Force
          Get-ChildItem -Path $asset | Select-Object -ExpandProperty FullName

      - name: Upload asset to GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "YTB-downloader-$tag.zip"
          $existing = gh release view $tag --json tagName 2>$null
          if (-not $existing) {
            gh release create $tag --title "YTB downloader $tag" --notes "YTB downloader $tag" --target $env:GITHUB_SHA
          }
          gh release upload $tag $asset --clobber
